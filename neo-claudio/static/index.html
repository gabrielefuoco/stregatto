<!DOCTYPE html>
<html lang="it" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stregatto - Neo-Claudio</title>
    
    <!-- Fonts & Material Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    
    <!-- xterm.css -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css" />
    
    <!-- Custom Theme & Utility CSS -->
    <link rel="stylesheet" href="/static/css/themes.css">
</head>
<body class="h-full bg-white font-body-md text-[#1a1c1c] overflow-hidden antialiased">
    
    <div class="app-layout h-full">
        <!-- Sidebar Left -->
        <aside id="sidebar-container"></aside>

        <!-- Main Content -->
        <main id="main-content" class="main-content flex flex-col h-full overflow-hidden bg-white">
            <div id="tab-bar-container"></div>
            <div id="toolbar-container"></div>
            
            <!-- Container del Terminale Neo-Brutalist -->
            <div class="terminal-wrapper flex-grow relative m-4 rounded-none overflow-hidden">
                <div id="terminal-area" class="absolute inset-0"></div>
            </div>
        </main>

        <!-- Sidebar Right -->
        <aside id="sidebar-right" class="sidebar-right flex flex-col bg-white">
            <div class="p-4 border-b-2 border-[#1a1c1c]">
                <h2 class="font-bold text-xl">MCP Apps</h2>
            </div>
            <!-- MCP list -->
        </aside>
    </div>

    <!-- xterm.js core e addons -->
    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-web-links@0.9.0/lib/xterm-addon-web-links.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-search@0.13.0/lib/xterm-addon-search.min.js"></script>

    <!-- App Logic -->
    <script type="module" src="/static/js/app.js"></script>
</body>
</html>
