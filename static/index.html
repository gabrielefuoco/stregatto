<!DOCTYPE html>
<html lang="it" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stregatto - Neo-Claudio</title>
    
    <!-- Fonts & Material Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS Script CDN con brand-orange e font custom -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'brand-orange': '#FF5F1F',
              'surface-bg': '#f9f9f9',
              'border-neo': '#1a1c1c'
            },
            fontFamily: {
              'headline': ['Space Grotesk', 'sans-serif'],
              'body': ['Work Sans', 'sans-serif']
            }
          }
        }
      }
    </script>


    <!-- xterm.css -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css" />
    
    <!-- Custom Theme & Utility CSS -->
    <link rel="stylesheet" href="/static/css/themes.css?v=30">
</head>
<body class="h-full bg-[#f4f4f4] font-body text-[#1a1c1c] overflow-hidden antialiased">
    
    <div class="app-layout h-full flex flex-row bg-[#f0f0f0] bg-blueprint p-3 gap-3 font-body overflow-hidden">
        <!-- Sidebar Left -->
        <aside id="sidebar-container" class="h-full flex flex-col z-20 shrink-0"></aside>

        <!-- Main Content -->
        <main id="main-content" class="main-content flex-1 flex flex-col h-full overflow-hidden p-0 w-full relative">
            
            <!-- View 1: Workspace Terminal View -->
            <div id="workspace-view" class="w-full h-full flex flex-col">
                <div class="terminal-wrapper neo-card-main flex flex-col flex-grow relative overflow-hidden">
                    <div id="workspace-header-container" class="shrink-0 bg-white border-b-2 border-black z-20"></div>
                    <!-- Terminal containers mounted dynamically here -->
                    <div id="terminal-area" class="flex-grow relative overflow-hidden bg-transparent"></div>
                </div>
            </div>

            <!-- View 2: Agent Gallery View -->
            <div id="gallery-view" class="w-full h-full flex flex-col hidden"></div>

            <!-- View 3: Settings View -->
            <div id="settings-view" class="w-full h-full flex flex-col hidden"></div>

        </main>
        
        <!-- Sidebar Right: MCP Apps -->
        <aside id="mcp-sidebar-container" class="h-full shrink-0 z-30 flex flex-col"></aside>
    </div>

    <!-- xterm.js core e addons -->
    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-web-links@0.9.0/lib/xterm-addon-web-links.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-search@0.13.0/lib/xterm-addon-search.min.js"></script>

    <!-- App Logic -->
    <script type="module" src="/static/js/app.js?v=30"></script>
</body>
</html>
